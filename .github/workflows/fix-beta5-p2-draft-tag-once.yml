name: Verify Beta5 p2 draft release version tag (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-beta5-p2-draft-tag-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify_tag:
    if: github.repository == 'Larppak/Nightfall-GPU-Miner'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: '424265220'
      TAG: v1.3.8-rc3-beta.5-p2
      EXPECTED_ARCHIVE_SHA: bb31b66d94354e625add8030cd36824aaf9bab0afff5eb00ed9f3208633a8012
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore human-readable release tag without publishing
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/before.json"
          python3 - "$RUNNER_TEMP/before.json" <<'PY'
          import json,os,sys
          r=json.load(open(sys.argv[1]))
          assert r['draft'] and r['prerelease']
          assert r['tag_name'].startswith('untagged-') or r['tag_name']==os.environ['TAG']
          names={a['name']:a for a in r['assets']}
          file="nightfall-miner-v1.3.8-rc3-beta.5-p2-linux-x86_64.tar.gz"
          assert set(names)=={file,file+".sha256"}
          assert names[file]['digest']=="sha256:"+os.environ['EXPECTED_ARCHIVE_SHA']
          assert len(r['body'])<3000
          print("BEFORE_DRAFT_TAG",r['tag_name'])
          PY
          jq -n --arg tag "$TAG" '{tag_name:$tag,draft:true,prerelease:true,target_commitish:"main"}' > "$RUNNER_TEMP/update.json"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            --input "$RUNNER_TEMP/update.json" > "$RUNNER_TEMP/after.json"
          python3 - "$RUNNER_TEMP/after.json" <<'PY'
          import json,os,sys
          r=json.load(open(sys.argv[1]))
          assert r['draft'] and r['prerelease']
          assert r['tag_name']==os.environ['TAG'], "Tag still changed to internal draft placeholder"
          assert len(r['assets'])==2
          print("BETA5_P2_DRAFT_TAG_FIXED",r['tag_name'],r['html_url'])
          PY
