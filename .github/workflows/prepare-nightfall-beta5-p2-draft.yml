name: Prepare Nightfall Beta5 p2 draft (assets uploaded manually)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-nightfall-beta5-p2-draft.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draft_release:
    if: github.repository == 'Larppak/Nightfall-GPU-Miner'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v1.3.8-rc3-beta.5-p2
      RELEASE_TITLE: Nightfall GPU Miner v1.3.8 RC3 Beta 5 p2 — NVIDIA + Experimental AMD
    steps:
      - name: Checkout public release notes only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure exact approved notes and create DRAFT only (no assets or publishing)
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/RELEASE_NOTES_BETA5_P2.md"
          test -s "$notes"
          grep -Fq 'bb31b66d94354e625add8030cd36824aaf9bab0afff5eb00ed9f3208633a8012' "$notes"
          grep -Fq 'EXPERIMENTAL / NOT GPU-TESTED' "$notes"
          # GitHub does not return draft releases via /releases/tags/{tag}.
          # Use the authenticated /releases collection instead.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - "$RUNNER_TEMP/releases.json" <<'PY'
          import json,os,sys
          releases=json.load(open(sys.argv[1]))
          matching=[r for r in releases if r.get("tag_name")==os.environ["RELEASE_TAG"]]
          assert len(matching)==1, "Expected exactly one pre-created release draft"
          r=matching[0]
          assert r["draft"] and r["prerelease"], "Release unexpectedly published or not pre-release"
          assert not r["assets"], "Release assets were attached already"
          assert r["name"]==os.environ["RELEASE_TITLE"], "Release title differs"
          assert "bb31b66d94354e625add8030cd36824aaf9bab0afff5eb00ed9f3208633a8012" in r["body"], "Release notes SHA mismatch"
          assert "EXPERIMENTAL / NOT GPU-TESTED" in r["body"], "AMD disclaimer missing"
          print("BETA5_P2_DRAFT_RELEASE_VERIFIED",r["id"],r["html_url"],"asset_count=0")
          PY
          echo "DRAFT_RELEASE_READY_ASSETS_NOT_UPLOADED"
