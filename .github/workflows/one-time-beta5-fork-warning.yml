name: One-time Beta5 p2 mandatory fork warning
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-beta5-fork-warning.yml
permissions:
  contents: write
jobs:
  publish_warning_to_existing_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.3.8-rc3-beta.5-p2
      SHA: bb31b66d94354e625add8030cd36824aaf9bab0afff5eb00ed9f3208633a8012
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm current release and uploaded archive, update ONLY release notes
        shell: bash
        run: |
          set -euo pipefail
          DOC=docs/RELEASE_SUMMARY_BETA5_P2.md
          grep -Fq 'block 500,000' "$DOC"
          grep -Fq 'Core 1.0.11' "$DOC"
          grep -Fq "$SHA" "$DOC"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json,os,sys
          r=json.load(open(sys.argv[1]))
          assert not r["draft"] and r["prerelease"] and r["tag_name"]==os.environ["TAG"]
          a={x["name"]:x for x in r["assets"]}
          name="nightfall-miner-v1.3.8-rc3-beta.5-p2-linux-x86_64.tar.gz"
          assert set(a)=={name,name+".sha256"}
          assert a[name]["digest"]=="sha256:"+os.environ["SHA"]
          assert all(x["state"]=="uploaded" for x in a.values())
          print("PUBLISHED_RELEASE_AND_ARTIFACT_VERIFIED",r["id"])
          PY
          jq -n --rawfile body "$DOC" '{body:$body}' > "$RUNNER_TEMP/patch.json"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/424265220" --input "$RUNNER_TEMP/patch.json" > "$RUNNER_TEMP/result.json"
          python3 - "$RUNNER_TEMP/result.json" "$DOC" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.load(open(sys.argv[1]))
          expected=Path(sys.argv[2]).read_text()
          assert r["body"].replace("\r\n","\n").strip()==expected.strip()
          assert not r["draft"] and r["prerelease"]
          assert len(r["assets"])==2
          print("BETA5_P2_FORK500000_RELEASE_WARNING_PASS",r["html_url"])
          PY
