name: Update Beta5 p2 published release with simple Linux quickstart (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-beta5-p2-simple-release-once.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release_quickstart:
    if: github.repository == 'Larppak/Nightfall-GPU-Miner'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.3.8-rc3-beta.5-p2
      FILE: nightfall-miner-v1.3.8-rc3-beta.5-p2-linux-x86_64.tar.gz
      SHA: bb31b66d94354e625add8030cd36824aaf9bab0afff5eb00ed9f3208633a8012
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify published assets and replace only release body
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/RELEASE_SUMMARY_BETA5_P2.md"
          test -s "$notes"
          grep -Fq "$SHA" "$notes"
          grep -Fq 'curl -fL --retry 3' "$notes"
          grep -Fq 'MODE="--system"' "$notes"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/before.json"
          python3 - "$RUNNER_TEMP/before.json" <<'PY'
          import json,os,sys
          r=json.load(open(sys.argv[1]))
          assert r["tag_name"]==os.environ["TAG"]
          assert not r["draft"] and r["prerelease"], "Must already be a published pre-release"
          assets={x["name"]:x for x in r["assets"]}
          file=os.environ["FILE"]
          assert set(assets)=={file,file+".sha256"}
          assert assets[file]["digest"]=="sha256:"+os.environ["SHA"]
          assert all(x["state"]=="uploaded" for x in assets.values())
          print("ORIGINAL_RELEASE_ASSET_INTEGRITY_PASS",r["id"])
          PY
          jq -n --rawfile body "$notes" '{body:$body}' > "$RUNNER_TEMP/patch.json"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/424265220" \
            --input "$RUNNER_TEMP/patch.json" > "$RUNNER_TEMP/after.json"
          python3 - "$RUNNER_TEMP/after.json" "$notes" <<'PY'
          import json,os,sys
          from pathlib import Path
          r=json.load(open(sys.argv[1]))
          body=Path(sys.argv[2]).read_text()
          assert r["body"].replace("\r\n","\n").strip()==body.strip()
          assert not r["draft"] and r["prerelease"]
          assert r["tag_name"]==os.environ["TAG"]
          assert len(r["assets"])==2
          assert any(a["digest"]=="sha256:"+os.environ["SHA"] for a in r["assets"])
          print("BETA5_P2_PUBLIC_QUICKSTART_RELEASE_PASS",r["id"],r["html_url"])
          PY
