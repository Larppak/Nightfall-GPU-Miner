name: Update Beta 2 release description (one-time)

on:
  push:
    branches: [main]
    paths: [.github/workflows/update-beta2-release-description.yml]

permissions:
  contents: write

jobs:
  update-release-description:
    if: github.repository == 'Larppak/Nightfall-GPU-Miner' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out public release notes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update existing Beta 2 description only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Larppak/Nightfall-GPU-Miner
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/RELEASE_NOTES_BETA2.md
          before="$(gh api repos/"$GH_REPO"/releases/414961535)"
          jq -e '.tag_name == "v1.3.8-rc3-beta.2" and .draft == false and .prerelease == true and ((.body == null) or (.body == "") or (.body == "@docs/RELEASE_NOTES_BETA2.md")) and (.assets | length) == 2' <<<"$before" >/dev/null
          python3 - <<'PY' > "$RUNNER_TEMP/beta2-release-body.json"
          import json
          from pathlib import Path
          print(json.dumps({"body": Path("docs/RELEASE_NOTES_BETA2.md").read_text()}))
          PY
          gh api --method PATCH repos/"$GH_REPO"/releases/414961535 \
            --input "$RUNNER_TEMP/beta2-release-body.json" >/dev/null
          after="$(gh api repos/"$GH_REPO"/releases/414961535)"
          jq -e '.tag_name == "v1.3.8-rc3-beta.2" and .draft == false and .prerelease == true and (.body | length) > 1000 and (.assets | length) == 2' <<<"$after" >/dev/null
          python3 -c 'import json,sys,pathlib; actual=json.load(sys.stdin)["body"]; expected=pathlib.Path("docs/RELEASE_NOTES_BETA2.md").read_text(); assert actual==expected, "Release description differs from public notes"' <<<"$after"
          echo "Release body updated, release identity and two assets verified."
